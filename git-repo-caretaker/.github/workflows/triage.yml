name: 🏷️ Issue & PR Triage

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage"
        required: false

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Triage Issue
        if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          OPENROUTER_MODEL: "meta-llama/llama-3.3-70b-instruct:free"
        run: |
          NUMBER="${{ github.event.issue.number || github.event.inputs.issue_number }}"
          python triage_bot.py ${{ github.repository }} issue $NUMBER

      - name: Triage PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          OPENROUTER_MODEL: "meta-llama/llama-3.3-70b-instruct:free"
        run: |
          python triage_bot.py ${{ github.repository }} pr ${{ github.event.pull_request.number }}
